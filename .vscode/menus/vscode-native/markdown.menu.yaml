# Markdown Menu (vscode-native)
# Top-level menu bar item, visible only for Markdown files.
# Uses only commands from internal extensions (vscode.markdown-language-features).
# For a richer version with marketplace extensions, see ../markdown.menu.yaml.

name: markdown
menu: MenubarMainMenu
title: Markdown
when: "editorLangId == markdown"
order: 7

items:

# ── Preview ──────────────────────────────────────────────────────────
- group: 1_preview
  items:
  - title: Open Preview
    command: markdown.showPreview
    icon: open-preview
    order: 1
  - title: Open Preview to the Side
    command: markdown.showPreviewToSide
    order: 2
  - title: Open Locked Preview to the Side
    command: markdown.showLockedPreviewToSide
    order: 3
  - title: Refresh Preview
    command: markdown.preview.refresh
    order: 4
  - title: Toggle Preview Locking
    command: markdown.preview.toggleLock
    order: 5
  - title: Show Source
    command: markdown.showSource
    order: 6
  - title: Change Preview Security Settings
    command: markdown.showPreviewSecuritySelector
    order: 7

# ── Insert ───────────────────────────────────────────────────────────
- group: 2_insert
  items:
  - title: Insert Heading
    snippet: "# ${1:Heading}\n$0"
    order: 1
  - title: Insert Link
    snippet: "[${1:text}](${2:url})"
    order: 2
  - title: Insert Image
    snippet: "![${1:alt text}](${2:url})"
    order: 3
  - title: Insert Image from Workspace
    command: markdown.editor.insertImageFromWorkspace
    order: 4
  - title: Insert Link from Workspace
    command: markdown.editor.insertLinkFromWorkspace
    order: 5
  - title: Insert Code Block
    snippet: "```${1:language}\n$0\n```"
    order: 6
  - title: Insert Bullet List
    snippet: "- ${1:item}\n- ${2:item}\n- ${3:item}\n$0"
    order: 7
  - title: Insert Numbered List
    snippet: "1. ${1:item}\n2. ${2:item}\n3. ${3:item}\n$0"
    order: 8
  - title: Insert Task List
    snippet: "- [ ] ${1:task}\n- [ ] ${2:task}\n$0"
    order: 9
  - title: Insert Table
    snippet: "| ${1:Col 1} | ${2:Col 2} | ${3:Col 3} |\n|---|---|---|\n| $4 | $5 | $6 |\n$0"
    order: 10
  - title: Insert Blockquote
    snippet: "> ${1:quote}\n$0"
    order: 11
  - title: Insert Horizontal Rule
    snippet: "\n---\n\n$0"
    order: 12

# ── Format ───────────────────────────────────────────────────────────
- group: 3_format
  items:
  - title: Toggle Bold
    snippet: "**${TM_SELECTED_TEXT:text}**"
    order: 1
  - title: Toggle Italic
    snippet: "*${TM_SELECTED_TEXT:text}*"
    order: 2
  - title: Toggle Strikethrough
    snippet: "~~${TM_SELECTED_TEXT:text}~~"
    order: 3
  - title: Toggle Code Span
    snippet: "`${TM_SELECTED_TEXT:code}`"
    order: 4
  - title: Format Document
    command: editor.action.formatDocument
    order: 5

# ── Navigate ─────────────────────────────────────────────────────────
- group: 4_navigate
  items:
  - title: Go to Symbol in Editor
    command: workbench.action.gotoSymbol
    order: 1
  - title: Find File References
    command: markdown.findAllFileReferences
    order: 2

# ── AI ───────────────────────────────────────────────────────────────
- group: 9_ai
  when: "hasExtension(GitHub.copilot-chat)"
  items:
  - title: Explain This Document
    chat: "Explain the content and structure of this Markdown document."
    order: 1
  - title: Improve Writing
    chat: "Improve the writing quality of the selected text. Fix grammar, clarity, and tone."
    order: 2
  - title: Generate Table of Contents
    chat: "Generate a table of contents for this Markdown document based on its headings."
    order: 3
