# Edit Menu Enhancements
# Injects new submenus into the built-in Edit menu.
# Avoids duplicating anything already in Edit or text-toolkit's 9_text group.
#
# text-toolkit already provides (in Edit → 9_text):
#   Convert Case, Line Operations, Sort, EOL Conversion, Blank Operations,
#   Copy Filename, Line Filtering, Sequence & Numbering, Join/Split, Alignment
#
# This file adds:
#   - Paste Special (group 6_paste)

name: edit-enhancements
menu: MenubarEditMenu

items:

# ── Paste Special ────────────────────────────────────────────────────
- position: "$#editor.action.clipboardPasteAction"
  title: Paste Special
  items:
  - title: Paste As…
    command: editor.action.pasteAs
  - title: Paste as Plain Text
    command: editor.action.pasteAsText
