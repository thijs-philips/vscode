# Git Menu
# Top-level menu bar item for Git operations.
# Only visible when a Git repository is open.
# Curated subset of the 183 git commands — most-used daily operations.
# The full Git functionality remains in the SCM sidebar.

name: git
menu: MenubarMainMenu
title: Git
when: "workspaceContains(.git)"
position: "$Selection"

items:

# ── Stage & Commit ───────────────────────────────────────────────────
- group: 1_commit
  items:
  - title: Stage All Changes
    command: git.stageAll
  - title: Unstage All Changes
    command: git.unstageAll
  - title: Discard All Changes
    command: git.cleanAll
  - title: Commit
    command: git.commit
  - title: Commit Staged
    command: git.commitStaged
  - title: Commit All
    command: git.commitAll
  - title: Commit (Amend)
    command: git.commitAmend
  - title: Undo Last Commit
    command: git.undoCommit

# ── Branch ───────────────────────────────────────────────────────────
- group: 2_branch
  items:
  - title: Checkout to…
    command: git.checkout
  - title: Create Branch…
    command: git.branch
  - title: Create Branch From…
    command: git.branchFrom
  - title: Delete Branch…
    command: git.deleteBranch
  - title: Rename Branch…
    command: git.renameBranch
  - title: Merge…
    command: git.merge
  - title: Rebase Branch…
    command: git.rebase
  - title: Publish Branch…
    command: git.publish

# ── Remote ───────────────────────────────────────────────────────────
- group: 3_remote
  items:
  - title: Pull
    command: git.pull
  - title: Pull (Rebase)
    command: git.pullRebase
  - title: Push
    command: git.push
  - title: Push (Follow Tags)
    command: git.pushWithTags
  - title: Fetch
    command: git.fetch
  - title: Fetch From All Remotes
    command: git.fetchAll
  - title: Sync
    command: git.sync
  - title: Add Remote…
    command: git.addRemote

# ── Stash ────────────────────────────────────────────────────────────
- group: 4_stash
  items:
  - title: Stash
    command: git.stash
  - title: Stash (Include Untracked)
    command: git.stashIncludeUntracked
  - title: Stash Staged
    command: git.stashStaged
  - title: Pop Latest Stash
    command: git.stashPopLatest
  - title: Apply Latest Stash
    command: git.stashApplyLatest
  - title: Pop Stash…
    command: git.stashPop
  - title: Drop Stash…
    command: git.stashDrop
  - title: View Stash…
    command: git.stashView

# ── Tags ─────────────────────────────────────────────────────────────
- group: 5_tags
  items:
  - title: Create Tag…
    command: git.createTag
  - title: Delete Tag…
    command: git.deleteTag
  - title: Push Tags
    command: git.pushTags

# ── View ─────────────────────────────────────────────────────────────
- group: 6_view
  items:
  - title: Open Changes
    command: git.openChange
  - title: Open All Changes
    command: git.openAllChanges
  - title: Close All Diff Editors
    command: git.closeAllDiffEditors
  - title: Toggle Blame Decoration
    command: git.blame.toggleEditorDecoration
  - title: Show Git Output
    command: git.showOutput

# ── Repo ─────────────────────────────────────────────────────────────
- group: 7_repo
  items:
  - title: Clone…
    command: git.clone
  - title: Initialize Repository
    command: git.init
  - title: Cherry Pick…
    command: git.cherryPick
