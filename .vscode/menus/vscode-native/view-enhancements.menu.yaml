# View Menu Enhancements
# Injects folding and editor display toggles into the built-in View menu.
# The View menu already has appearance, layout, explorer panels, etc.
# This adds a Folding submenu and an Editor Display submenu.

name: view-enhancements
menu: MenubarViewMenu

items:

# ── Folding ──────────────────────────────────────────────────────────
- group: 8_folding
  title: Folding
  items:
  - title: Toggle Fold at Cursor
    command: editor.toggleFold
  - title: Fold Region
    command: editor.fold
  - title: Unfold Region
    command: editor.unfold
  - title: Fold Recursively
    command: editor.foldRecursively
  - title: Unfold Recursively
    command: editor.unfoldRecursively
  - title: Fold All
    command: editor.foldAll
  - title: Unfold All
    command: editor.unfoldAll
  - title: Fold All Block Comments
    command: editor.foldAllBlockComments
  - title: Fold All Marker Regions
    command: editor.foldAllMarkerRegions
  - title: Unfold All Marker Regions
    command: editor.unfoldAllMarkerRegions
  - title: Fold All Except Selected
    command: editor.foldAllExcept
  - title: Unfold All Except Selected
    command: editor.unfoldAllExcept
  - title: Fold Level 1
    command: editor.foldLevel1
  - title: Fold Level 2
    command: editor.foldLevel2
  - title: Fold Level 3
    command: editor.foldLevel3
  - title: Fold Level 4
    command: editor.foldLevel4
  - title: Fold Level 5
    command: editor.foldLevel5
  - title: Fold Level 6
    command: editor.foldLevel6
  - title: Fold Level 7
    command: editor.foldLevel7

# ── Editor Display ───────────────────────────────────────────────────
- group: 9_display
  title: Editor Display
  items:
  - title: Toggle Word Wrap
    command: editor.action.toggleWordWrap
  - title: Toggle Minimap
    command: editor.action.toggleMinimap
  - title: Toggle Breadcrumbs
    command: breadcrumbs.toggle
  - title: Toggle Sticky Scroll
    command: editor.action.toggleStickyScroll
  - title: Toggle Render Whitespace
    command: editor.action.toggleRenderWhitespace
  - title: Toggle Render Control Characters
    command: editor.action.toggleRenderControlCharacter

# ── Menu Layout ──────────────────────────────────────────────────────
- group: 2_appearance
  title: Menu Layout
  position: "$Editor Layout"
  items:
  - title: Reload Menus
    command: menuLoader.reload
  - title: Validate Menu Files
    command: menuLoader.validateMenus
  - title: Show Menu Tree
    command: menuLoader.showMenuTree
  - title: Open Menus Folder
    command: menuLoader.openMenusFolder
  - title: Create Menu with Copilot…
    command: menuLoader.createMenu
    icon: spark
  - title: Toggle Toolbar Strip
    command: menuLoader.toggleToolbar
    icon: layout
