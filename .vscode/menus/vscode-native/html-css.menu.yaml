# HTML & CSS Menu
# Top-level menu bar item for HTML, CSS, SCSS, and Less files.
# Combines Emmet actions, formatting, and navigation into one menu.
# Commands from: emmet, html-language-features, css-language-features, editor core.

name: html-css
menu: MenubarMainMenu
title: HTML / CSS
when: "editorLangId == html || editorLangId == css || editorLangId == scss || editorLangId == less"
position: "$Selection"

items:

# ── Emmet ────────────────────────────────────────────────────────────
- group: 1_emmet
  items:
  - title: Expand Abbreviation
    command: editor.emmet.action.expandAbbreviation
  - title: Wrap with Abbreviation
    command: editor.emmet.action.wrapWithAbbreviation
  - title: Remove Tag
    command: editor.emmet.action.removeTag
    when: "editorLangId == html"
  - title: Update Tag
    command: editor.emmet.action.updateTag
    when: "editorLangId == html"
  - title: Split / Join Tag
    command: editor.emmet.action.splitJoinTag
    when: "editorLangId == html"
  - title: Go to Matching Pair
    command: editor.emmet.action.matchTag
    when: "editorLangId == html"
  - title: Balance (Inward)
    command: editor.emmet.action.balanceIn
    when: "editorLangId == html"
  - title: Balance (Outward)
    command: editor.emmet.action.balanceOut
    when: "editorLangId == html"

# ── Emmet Navigate ───────────────────────────────────────────────────
- group: 2_emmet_nav
  items:
  - title: Go to Next Edit Point
    command: editor.emmet.action.nextEditPoint
  - title: Go to Previous Edit Point
    command: editor.emmet.action.prevEditPoint
  - title: Select Next Item
    command: editor.emmet.action.selectNextItem
  - title: Select Previous Item
    command: editor.emmet.action.selectPrevItem

# ── Emmet Math & Values ─────────────────────────────────────────────
- group: 3_emmet_values
  items:
  - title: Evaluate Math Expression
    command: editor.emmet.action.evaluateMathExpression
  - title: Reflect CSS Value
    command: editor.emmet.action.reflectCSSValue
    when: "editorLangId == css || editorLangId == scss || editorLangId == less"
  - title: Update Image Size
    command: editor.emmet.action.updateImageSize
    when: "editorLangId == html"
  - title: Increment by 0.1
    command: editor.emmet.action.incrementNumberByOneTenth
  - title: Increment by 1
    command: editor.emmet.action.incrementNumberByOne
  - title: Increment by 10
    command: editor.emmet.action.incrementNumberByTen
  - title: Decrement by 0.1
    command: editor.emmet.action.decrementNumberByOneTenth
  - title: Decrement by 1
    command: editor.emmet.action.decrementNumberByOne
  - title: Decrement by 10
    command: editor.emmet.action.decrementNumberByTen

# ── Format ───────────────────────────────────────────────────────────
- group: 4_format
  items:
  - title: Format Document
    command: editor.action.formatDocument
  - title: Format Selection
    command: editor.action.formatSelection
    when: "editorHasSelection"
  - title: Toggle Line Comment
    command: editor.action.commentLine
  - title: Toggle Emmet Comment
    command: editor.emmet.action.toggleComment

# ── Navigate ─────────────────────────────────────────────────────────
- group: 5_navigate
  items:
  - title: Go to Definition
    command: editor.action.revealDefinition
  - title: Go to References
    command: editor.action.goToReferences
  - title: Go to Symbol in Editor
    command: workbench.action.gotoSymbol
  - title: Merge Lines
    command: editor.emmet.action.mergeLines

# ── AI ───────────────────────────────────────────────────────────────
- group: 9_ai
  when: "hasExtension(GitHub.copilot-chat)"
  items:
  - title: Explain
    command: github.copilot.chat.explain
  - title: Fix
    command: github.copilot.chat.fix
  - title: Generate Tests
    command: github.copilot.chat.generateTests
  - title: Generate Docs
    command: github.copilot.chat.generateDocs
