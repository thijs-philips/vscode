# YAML Menu — .menu.yaml
# A comprehensive YAML editing menu: convert, format, fix indentation,
# fold, sort/transform lines, and AI-assisted actions.
# Appears in the menu bar only when a .yaml / .yml file is active.
#
# Extensions used (auto-hidden when not installed):
#   ahebrank.yaml2json      — yaml2json.*
#   hilleer.yaml-plus-json  — extension.rightClick*, extension.convert*, extension.preview*
#   vscode.text-toolkit     — textToolkit.*
#   GitHub.copilot-chat     — chat actions

name: yaml
menu: MenubarMainMenu
title: YAML
when: "editorLangId == yaml"
order: 13
icon: symbol-namespace

items:

# ── Convert ──────────────────────────────────────────────────────────
- group: 1_convert
  items:
  - title: Convert Document → JSON
    command: extension.rightClickYaml
    when: "hasExtension(hilleer.yaml-plus-json)"
    icon: arrow-right
    order: 1
  - title: Convert Document → JSON (yaml2json)
    command: yaml2json.document
    when: "hasExtension(ahebrank.yaml2json)"
    icon: arrow-right
    order: 2
  - title: Convert Selection → JSON
    command: extension.yamlSelectionToJson
    when: "hasExtension(hilleer.yaml-plus-json) && editorHasSelection"
    order: 3
  - title: Preview as JSON
    command: extension.previewAsJson
    when: "hasExtension(hilleer.yaml-plus-json)"
    icon: open-preview
    order: 4
  - title: Clipboard YAML → JSON
    command: yaml2json.clipboard
    when: "hasExtension(ahebrank.yaml2json)"
    order: 5
  - title: Convert YAML Files → JSON (Explorer)
    command: extension.convertYamlFilesToJson
    when: "hasExtension(hilleer.yaml-plus-json)"
    order: 6

# ── Format & Fix ─────────────────────────────────────────────────────
# YAML is whitespace-sensitive — indentation and trailing spaces matter.
- group: 2_format
  items:
  - title: Format Document
    command: editor.action.formatDocument
    icon: sparkle
    order: 1
  - title: Format Selection
    command: editor.action.formatSelection
    when: "editorHasSelection"
    order: 2
  - title: Convert Indentation to Spaces
    command: editor.action.indentationToSpaces
    icon: symbol-property
    order: 3
  - title: TAB → Spaces
    command: textToolkit.tabToSpace
    when: "hasExtension(vscode.text-toolkit)"
    order: 4
  - title: Trim Trailing Whitespace
    command: editor.action.trimTrailingWhitespace
    order: 5
  - title: Trim Leading & Trailing Space
    command: textToolkit.trimBoth
    when: "hasExtension(vscode.text-toolkit)"
    order: 6
  - title: Remove Empty Lines
    command: textToolkit.removeEmptyLines
    when: "hasExtension(vscode.text-toolkit)"
    order: 7
  - title: Detect Indentation
    command: editor.action.detectIndentation
    order: 8

# ── View & Fold ──────────────────────────────────────────────────────
- group: 3_view
  items:
  - title: Fold All
    command: editor.foldAll
    icon: fold
    order: 1
  - title: Unfold All
    command: editor.unfoldAll
    icon: unfold
    order: 2
  - title: Toggle Fold at Cursor
    command: editor.toggleFold
    order: 3
  - title: Fold Level 1
    command: editor.foldLevel1
    order: 4
  - title: Fold Level 2
    command: editor.foldLevel2
    order: 5
  - title: Fold Level 3
    command: editor.foldLevel3
    order: 6
  - title: Go to Symbol
    command: workbench.action.gotoSymbol
    icon: symbol-field
    order: 7

# ── AI / Copilot ─────────────────────────────────────────────────────
# (Generic line-sort/transform operations omitted: they are already
#  reachable via VS Code's built-in Selection menu and do not
#  understand YAML structure.)
- group: 4_ai
  when: "hasExtension(GitHub.copilot-chat)"
  items:
  - title: Explain this YAML
    chat: "Explain the structure, purpose and key fields of this YAML file"
    icon: comment-discussion
    order: 1
  - title: Validate & Suggest Fixes
    chat: "Validate this YAML file for correctness, common mistakes and best practices, and suggest improvements"
    icon: pass
    order: 2
  - title: Convert to JSON (Copilot)
    chat: "Convert this YAML file to equivalent, well-formatted JSON"
    icon: arrow-right
    order: 3
  - title: Generate Schema
    chat: "Generate a JSON Schema that describes the structure of this YAML file"
    icon: symbol-namespace
    order: 4
  - title: Add Comments / Documentation
    chat: "Add clear inline comments to this YAML file explaining each section and key field"
    icon: book
    order: 5
