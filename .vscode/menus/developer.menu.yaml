# Developer Menu — generated by Copilot from menuLoader.dumpAll
# Covers: editor actions, code navigation, text transforms (Text Toolkit),
# GitHub Copilot AI actions, Python, YAML/JSON conversion, and debugging.
# Appears in the menu bar at all times (no top-level `when`).
#
# Commands sourced from: .vscode/menus/.cache/commands.md
# Selected extensions: vscode built-in, Text Toolkit, GitHub Copilot Chat,
#   ms-python.python, ahebrank.yaml2json, hilleer.yaml-plus-json

name: developer
menu: MenubarMainMenu
title: Developer
order: 13

items:

# ── Editor ───────────────────────────────────────────────────────────
- group: 1_editor
  items:
  - title: Format Document
    command: editor.action.formatDocument
    icon: sparkle
    order: 1
  - title: Format Selection
    command: editor.action.formatSelection
    when: "editorHasSelection"
    order: 2
  - title: Quick Fix
    command: editor.action.quickFix
    icon: lightbulb
    order: 3
  - title: Fix All
    command: editor.action.fixAll
    order: 4
  - title: Rename Symbol
    command: editor.action.rename
    order: 5
  - title: Toggle Line Comment
    command: editor.action.commentLine
    order: 6
  - title: Toggle Block Comment
    command: editor.action.blockComment
    order: 7
  - title: Trim Trailing Whitespace
    command: editor.action.trimTrailingWhitespace
    order: 8
  - title: Toggle Word Wrap
    command: editor.action.toggleWordWrap
    order: 9

# ── Imports (TypeScript / JavaScript only) ───────────────────────────
- group: 2_imports
  when: "editorLangId == typescript || editorLangId == javascript || editorLangId == typescriptreact || editorLangId == javascriptreact"
  items:
  - title: Organize Imports
    command: editor.action.organizeImports
    order: 1
  - title: Sort Imports
    command: typescript.sortImports
    when: "editorLangId == typescript || editorLangId == typescriptreact"
    order: 2
  - title: Sort Imports
    command: javascript.sortImports
    when: "editorLangId == javascript || editorLangId == javascriptreact"
    order: 2
  - title: Remove Unused Imports
    command: typescript.removeUnusedImports
    when: "editorLangId == typescript || editorLangId == typescriptreact"
    order: 3
  - title: Remove Unused Imports
    command: javascript.removeUnusedImports
    when: "editorLangId == javascript || editorLangId == javascriptreact"
    order: 3

# ── Navigate ─────────────────────────────────────────────────────────
- group: 3_navigate
  items:
  - title: Go to Definition
    command: editor.action.revealDefinition
    order: 1
  - title: Go to Type Definition
    command: editor.action.goToTypeDefinition
    order: 2
  - title: Go to Implementation
    command: editor.action.goToImplementation
    order: 3
  - title: Go to References
    command: editor.action.goToReferences
    order: 4
  - title: Find All References
    command: references-view.findReferences
    order: 5
  - title: Show Call Hierarchy
    command: editor.showCallHierarchy
    order: 6
  - title: Go to Symbol in Editor
    command: workbench.action.gotoSymbol
    order: 7
  - title: Find in Files
    command: workbench.action.findInFiles
    order: 8

# ── Text Transformations (Text Toolkit) ──────────────────────────────
- group: 4_text
  items:
  - title: Transform Case
    icon: symbol-operator
    items:
    - title: UPPERCASE
      command: textToolkit.toUpperCase
      order: 1
    - title: lowercase
      command: textToolkit.toLowerCase
      order: 2
    - title: Proper Case
      command: textToolkit.toProperCase
      order: 3
    - title: Sentence case
      command: textToolkit.toSentenceCase
      order: 4
    - title: Invert Case
      command: textToolkit.toInvertCase
      order: 5
    - title: camelCase
      command: editor.action.transformToCamelcase
      order: 6
    - title: PascalCase
      command: editor.action.transformToPascalcase
      order: 7
    - title: snake_case
      command: editor.action.transformToSnakecase
      order: 8
    - title: kebab-case
      command: editor.action.transformToKebabcase
      order: 9
  - title: Sort Lines
    icon: list-ordered
    items:
    - title: Sort Ascending
      command: textToolkit.sortLexAsc
      order: 1
    - title: Sort Descending
      command: textToolkit.sortLexDesc
      order: 2
    - title: Sort Ascending (Ignore Case)
      command: textToolkit.sortLexAscIgnoreCase
      order: 3
    - title: Sort as Integers Ascending
      command: textToolkit.sortIntAsc
      order: 4
    - title: Reverse Order
      command: textToolkit.reverseLineOrder
      order: 5
  - title: Line Operations
    icon: list-flat
    items:
    - title: Remove Duplicate Lines
      command: textToolkit.removeDuplicateLines
      order: 1
    - title: Remove Empty Lines
      command: textToolkit.removeEmptyLines
      order: 2
    - title: Join Lines
      command: textToolkit.joinLines
      order: 3
    - title: Split Lines
      command: textToolkit.splitLines
      order: 4
    - title: Duplicate Current Line
      command: textToolkit.duplicateLine
      order: 5
    - title: Move Line Up
      command: textToolkit.moveLineUp
      order: 6
    - title: Move Line Down
      command: textToolkit.moveLineDown
      order: 7
  - title: Whitespace
    icon: whitespace
    items:
    - title: Trim Trailing Space
      command: textToolkit.trimTrailing
      order: 1
    - title: Trim Leading Space
      command: textToolkit.trimLeading
      order: 2
    - title: Trim Both Ends
      command: textToolkit.trimBoth
      order: 3
    - title: TAB to Space
      command: textToolkit.tabToSpace
      order: 4
    - title: Space to TAB (Leading)
      command: textToolkit.spaceToTabLeading
      order: 5

# ── GitHub Copilot AI Actions ─────────────────────────────────────────
- group: 5_copilot
  when: "hasExtension(GitHub.copilot-chat)"
  items:
  - title: Explain
    command: github.copilot.chat.explain
    icon: comment-discussion
    order: 1
  - title: Fix
    command: github.copilot.chat.fix
    icon: tools
    order: 2
  - title: Generate Tests
    command: github.copilot.chat.generateTests
    icon: beaker
    order: 3
  - title: Generate Docs
    command: github.copilot.chat.generateDocs
    icon: book
    order: 4
  - title: Code Review
    command: github.copilot.chat.review
    icon: eye
    order: 5
  - title: Generate Commit Message
    command: github.copilot.git.generateCommitMessage
    icon: git-commit
    order: 6
  - title: Open Copilot Chat
    command: workbench.action.chat.open
    icon: copilot
    order: 7

# ── Python ────────────────────────────────────────────────────────────
- group: 6_python
  when: "editorLangId == python && hasExtension(ms-python.python)"
  items:
  - title: Run Python File
    command: python.execInTerminal
    icon: play
    order: 1
  - title: Run Selection in Terminal
    command: python.execSelectionInTerminal
    when: "editorHasSelection"
    icon: run-above
    order: 2
  - title: Select Python Interpreter
    command: python.setInterpreter
    order: 3
  - title: Create Python Environment
    command: python.createEnvironment
    order: 4
  - title: Start Native Python REPL
    command: python.startNativeREPL
    order: 5

# ── YAML / JSON Conversion ────────────────────────────────────────────
- group: 7_convert
  items:
  - title: YAML ↔ JSON
    icon: arrow-swap
    items:
    - title: YAML to JSON (Document)
      command: yaml2json.document
      when: "resourceExtname == .yaml || resourceExtname == .yml"
      order: 1
    - title: Convert File to JSON
      command: extension.rightClickYaml
      when: "resourceExtname == .yaml || resourceExtname == .yml"
      order: 2
    - title: Convert File to YAML
      command: extension.rightClickJson
      when: "resourceExtname == .json"
      order: 3
    - title: Preview as YAML
      command: extension.previewAsYaml
      when: "resourceExtname == .json"
      order: 4
    - title: Preview as JSON
      command: extension.previewAsJson
      when: "resourceExtname == .yaml || resourceExtname == .yml"
      order: 5
    - title: Convert Selection to JSON
      command: extension.yamlSelectionToJson
      when: "(resourceExtname == .yaml || resourceExtname == .yml) && editorHasSelection"
      order: 6
    - title: Convert Selection to YAML
      command: extension.jsonSelectionToYaml
      when: "resourceExtname == .json && editorHasSelection"
      order: 7

# ── Debugging ─────────────────────────────────────────────────────────
- group: 8_debug
  items:
  - title: Start Debugging
    command: workbench.action.debug.start
    icon: debug-start
    order: 1
  - title: Run Without Debugging
    command: workbench.action.debug.run
    icon: run
    order: 2
  - title: Stop
    command: workbench.action.debug.stop
    icon: debug-stop
    order: 3
  - title: Restart
    command: workbench.action.debug.restart
    icon: debug-restart
    order: 4
  - title: Toggle Breakpoint
    command: editor.debug.action.toggleBreakpoint
    icon: debug-breakpoint
    order: 5
  - title: Step Over
    command: workbench.action.debug.stepOver
    icon: debug-step-over
    order: 6
  - title: Step Into
    command: workbench.action.debug.stepInto
    icon: debug-step-into
    order: 7
  - title: Step Out
    command: workbench.action.debug.stepOut
    icon: debug-step-out
    order: 8
