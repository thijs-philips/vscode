# Markdown Menu — sample .menu.yaml
# A comprehensive Markdown menu built from built-in commands, snippets,
# and third-party extension commands (auto-hidden when not installed).
# Place in ~/.vscode/menus/ or .vscode/menus/ in a project.

name: markdown
menu: MenubarMainMenu
when: "editorLangId == markdown"
title: Markdown
order: 10

items:
  # ── Basic formatting (snippets — always available) ──────────────────
  - group: 1_format
    items:
      - title: Toggle Bold
        snippet: "**${TM_SELECTED_TEXT}**"
        order: 1
      - title: Toggle Italic
        snippet: "_${TM_SELECTED_TEXT}_"
        order: 2
      - title: Toggle Strikethrough
        snippet: "~~${TM_SELECTED_TEXT}~~"
        order: 3
      - title: Toggle Code Span
        snippet: "`${TM_SELECTED_TEXT}`"
        order: 4
      - title: Increase Heading Level
        when: "hasExtension(yzhang.markdown-all-in-one)"
        command: markdown.extension.toggleHeadingUp
        order: 5
      - title: Decrease Heading Level
        when: "hasExtension(yzhang.markdown-all-in-one)"
        command: markdown.extension.toggleHeadingDown
        order: 6

  # ── Insert structures ───────────────────────────────────────────────
  - group: 2_insert
    items:
      - title: Insert Heading
        snippet: "## ${1:Heading}\n"
        order: 1
      - title: Insert Link
        snippet: "[${TM_SELECTED_TEXT:link text}](${1:url})"
        order: 2
      - title: Insert Image
        snippet: "![${1:alt text}](${2:path})"
        order: 3
      - title: Insert Image from Workspace
        command: markdown.editor.insertImageFromWorkspace
        order: 4
      - title: Insert Link from Workspace
        command: markdown.editor.insertLinkFromWorkspace
        order: 5
      - title: Insert Code Block
        snippet: "```${1:language}\n${TM_SELECTED_TEXT}\n```"
        order: 6
      - title: Insert Bullet List
        snippet: "- ${1:item}\n- ${2:item}\n- ${3:item}"
        order: 7
      - title: Insert Numbered List
        snippet: "1. ${1:item}\n2. ${2:item}\n3. ${3:item}"
        order: 8
      - title: Insert Task List
        snippet: "- [ ] ${1:task}\n- [ ] ${2:task}\n- [ ] ${3:task}"
        order: 9
      - title: Insert Blockquote
        snippet: "> ${TM_SELECTED_TEXT}"
        order: 10
      - title: Insert Horizontal Rule
        snippet: "\n---\n"
        order: 11
      - title: Insert Math Block
        snippet: "$$\n${TM_SELECTED_TEXT}$1\n$$"
        order: 12

  # ── Table operations ────────────────────────────────────────────────
  - group: 3_table
    items:
      - title: Insert Table
        snippet: "| ${1:Header 1} | ${2:Header 2} | ${3:Header 3} |\n| --- | --- | --- |\n| ${4:Cell} | ${5:Cell} | ${6:Cell} |"
        order: 1
      - title: Paste Excel as Markdown Table
        when: "hasExtension(csholmq.excel-to-markdown-table)"
        command: excelToMarkdown.excelToMarkdownTable
        order: 2
      - title: Format Table
        when: "hasExtension(TakumiI.markdowntable)"
        command: markdowntable.format
        order: 3
      - title: Prettify All Tables
        when: "hasExtension(darkriszty.markdown-table-prettify)"
        command: markdownTable.prettify
        order: 4

  # ── Table of Contents (Markdown All in One) ─────────────────────────
  - group: 4_toc
    when: "hasExtension(yzhang.markdown-all-in-one)"
    items:
      - title: Create Table of Contents
        command: markdown.extension.toc.create
        order: 1
      - title: Update Table of Contents
        command: markdown.extension.toc.update
        order: 2
      - title: Add Section Numbers
        command: markdown.extension.toc.addSecNumbers
        order: 3
      - title: Remove Section Numbers
        command: markdown.extension.toc.removeSecNumbers
        order: 4

  # ── Preview ─────────────────────────────────────────────────────────
  - group: 5_preview
    items:
      - title: Open Preview
        command: markdown.showPreview
        order: 1
      - title: Open Preview to the Side
        command: markdown.showPreviewToSide
        order: 2
      - title: Refresh Preview
        command: markdown.preview.refresh
        order: 3
      - title: Open Preview (Enhanced)
        when: "hasExtension(shd101wyy.markdown-preview-enhanced)"
        command: markdown-preview-enhanced.openPreviewToTheSide
        order: 4

  # ── Export / Print ──────────────────────────────────────────────────
  - group: 6_export
    items:
      - title: Print to HTML
        when: "hasExtension(yzhang.markdown-all-in-one)"
        command: markdown.extension.printToHtml
        order: 1
      - title: Export to PDF
        when: "hasExtension(yzane.markdown-pdf)"
        command: extension.markdown-pdf.pdf
        order: 2
      - title: Export to HTML
        when: "hasExtension(yzane.markdown-pdf)"
        command: extension.markdown-pdf.html
        order: 3
      - title: Export to All Formats
        when: "hasExtension(yzane.markdown-pdf)"
        command: extension.markdown-pdf.all
        order: 4
      - title: Export Slide Deck
        when: "hasExtension(marp-team.marp-vscode)"
        command: markdown.marp.export
        order: 5

  # ── Marp slide authoring ────────────────────────────────────────────
  - group: 7_marp
    when: "hasExtension(marp-team.marp-vscode)"
    items:
      - title: Toggle Marp Feature
        command: markdown.marp.toggleMarpFeature
        order: 1
      - title: New Marp Slide File
        command: markdown.marp.newMarpMarkdown
        order: 2

  # ── Linting ─────────────────────────────────────────────────────────
  - group: 8_lint
    when: "hasExtension(DavidAnson.vscode-markdownlint)"
    items:
      - title: Fix All Lint Violations
        command: markdownlint.fixAll
        order: 1
      - title: Toggle Linting
        command: markdownlint.toggleLinting
        order: 2
      - title: Open Lint Config
        command: markdownlint.openConfigFile
        order: 3

  # ── Find references ─────────────────────────────────────────────────
  - group: 9_references
    items:
      - title: Find All File References
        command: markdown.findAllFileReferences
        order: 1
